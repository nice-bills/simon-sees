name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Dry run in the terminal (mock decider, replayed frames)
        run: python -m simon_sees dryrun --replay samples/people --segmenter mock --embedder mock --decider mock --fast --seed 3 --log /tmp/decisions.jsonl

  e2e:
    # Phone web client, end to end, with e2e by TesterArmy (https://github.com/tester-army/e2e).
    # The runner starts the real server in dry-run mode (replayed frames + seeded mock decider).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Install browsers
        run: npx e2e-web install chromium --with-deps
      - name: Run e2e (desktop + phone viewport)
        run: npx e2e run --reporter list,junit
        env:
          SIMON_PYTHON: python
          E2E_BROWSER: chromium
          E2E_TELEMETRY_DISABLED: "1"
          # optional: enables the agent.act / agent.assert test; without it that test is skipped
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: |
            e2e/.e2e/report.json
            e2e/.e2e/junit.xml
            e2e/.e2e/artifacts
            e2e/.e2e/logs
          if-no-files-found: warn
          retention-days: 7
